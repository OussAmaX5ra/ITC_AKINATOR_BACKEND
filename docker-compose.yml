services:
  # ── PostgreSQL 16 Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: akinator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akinator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akinator}
      POSTGRES_DB: ${POSTGRES_DB:-akinator_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akinator} -d ${POSTGRES_DB:-akinator_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 Live Session Store & Pub/Sub ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: akinator_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask Backend API ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akinator_api
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-akinator}:${POSTGRES_PASSWORD:-akinator}@postgres:5432/${POSTGRES_DB:-akinator_db}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5000:5000"
    command: sh -c "flask db upgrade && gunicorn -w 4 -k gevent -b 0.0.0.0:5000 --timeout 120 wsgi:app"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx Reverse Proxy (TLS & WebSockets) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: akinator_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
